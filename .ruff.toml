line-length = 100
# ADABOOT-CHANGE: Python 3.12+ (was py310), and skip tools/uf2conv.py, which
# is vendored from microsoft/uf2 and kept close to it for resyncs.
target-version = "py312"
extend-exclude = ["tools/uf2conv.py"]

[lint]
select = [
    "B",      # flake8-bugbear
    "E",      # pycodestyle
    "F",      # pyflakes
    "I",      # isort
    "SIM",    # flake8-simplify
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
]

ignore = [
    "SIM108", # Allow if-else blocks instead of forcing ternary operator
]

[format]
quote-style = "preserve"
line-ending = "lf"
