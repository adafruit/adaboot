name: mcuboot

samples:
  - boot/zephyr
build:
  cmake: ./boot/bootutil/zephyr
  # ADABOOT-CHANGE: Kconfig defaults for RP2 boot-mode retention.
  kconfig: zephyr/Kconfig
  sysbuild-cmake: boot/zephyr/sysbuild
  sysbuild-kconfig: dts/Kconfig.sysbuild
package-managers:
  pip:
    requirement-files:
      - zephyr/requirements.txt
