# Combined bootloader update mode: UF2 over USB Mass Storage and SMP
# serial recovery over CDC ACM, both active at the same time in a single
# bootloader mode (see docs/uf2.md).
#
# Requires a board with a USB device controller and a zephyr,cdc-acm-uart
# node (see usb_cdc_acm.overlay).
#
# Usage:
#   west build -b <board> boot/zephyr -- \
#     -DEXTRA_CONF_FILE=uf2_serial_recovery.conf \
#     -DDTC_OVERLAY_FILE=usb_cdc_acm.overlay

# Like the Adaboot boards (conf/mode-single_app.conf): hash-only images so
# the update transports fit in a small boot partition.
CONFIG_BOOT_SIGNATURE_TYPE_NONE=y

# UF2 drag-and-drop over USB Mass Storage
CONFIG_MCUBOOT_UF2=y
CONFIG_MCUBOOT_UF2_NO_APPLICATION=y

# SMP serial recovery over CDC ACM on the same USB device
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_CDC_ACM=y
CONFIG_UART_CONSOLE=n

# Keep the build small enough for the nrf52840dk 72 KB "big" boot partition
# used by this test (boards/nrf52840_big.overlay)
CONFIG_LOG=n
