# The layout puts slot1 (and the filesystem) on the DK's external
# jedec,spi-nor chip, so the SPI NOR driver must be compiled: the default
# flash map emits an entry for every partition whose backing device is
# status="okay" and that entry references the device struct. (conf/adaboot.conf
# forces SPI_NOR=y for the same reason; this board conf used to disable it.)
CONFIG_SPI_NOR=y

# The board's zephyr,uart-mcumgr is the same UART as the console; serial
# recovery drives that UART directly, and serial_adapter.c #errors while
# UART console owns it. (Other serial-only boards without a UART console
# get UART_CONSOLE=n from the Kconfig default in Kconfig.serial_recovery.)
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

CONFIG_BOOT_WATCHDOG_FEED=n

# Ensure the fastest RRAM write operations
CONFIG_NRF_RRAM_WRITE_BUFFER_SIZE=32
