# Sample Kconfig fragment for enabling UF2 drag-and-drop update mode.
#
# Usage:
#   west build -b <board> boot/zephyr -- -DEXTRA_CONF_FILE=uf2.conf
#
# The board must have USB device support. You may also need a
# device tree overlay to enable the USB controller (see usb_msc_uf2.overlay).

# Enable UF2 mode
CONFIG_MCUBOOT_UF2=y

# Enter UF2 mode if no bootable application is found
CONFIG_MCUBOOT_UF2_NO_APPLICATION=y

# USB Mass Storage settings - disk name must match
CONFIG_MASS_STORAGE_DISK_NAME="UF2"

# USB device stack settings
CONFIG_USB_DEVICE_PRODUCT="MCUboot UF2"
CONFIG_USB_DEVICE_VID=0x239A
CONFIG_USB_DEVICE_PID=0x0035

# Ensure main thread is preemptible for USB
CONFIG_MAIN_THREAD_PRIORITY=0
