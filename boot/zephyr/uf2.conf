# Sample Kconfig fragment for enabling UF2 drag-and-drop update mode.
#
# Usage:
#   west build -b <board> boot/zephyr -- -DEXTRA_CONF_FILE=uf2.conf
#
# The board must have USB device support. You may also need a
# device tree overlay to enable the USB controller (see usb_msc_uf2.overlay).

# Enable UF2 mode
CONFIG_MCUBOOT_UF2=y

# Enter UF2 mode if no bootable application is found
CONFIG_MCUBOOT_UF2_NO_APPLICATION=y

# Ensure main thread is preemptible for USB
CONFIG_MAIN_THREAD_PRIORITY=0

# Optionally combine with SMP serial recovery. When the serial recovery
# device is CDC ACM (native USB), enabling both gives a single bootloader
# update mode: the UF2 mass storage drive and the mcumgr serial port are
# active at the same time on one USB device. This requires a
# zephyr,cdc-acm-uart node on the USB controller in the board devicetree
# (see usb_cdc_acm.overlay or dts/nordic/nrf54lm20dk.dtsi).
# CONFIG_MCUBOOT_SERIAL=y
# CONFIG_BOOT_SERIAL_CDC_ACM=y
