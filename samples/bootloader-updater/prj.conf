#
# Bootloader updater application configuration.
#
# This image is chain-loaded by mcuboot, so it is built as a slot0 mcuboot
# image (CONFIG_BOOTLOADER_MCUBOOT). Adaboot bootloaders are built hash-only
# (CONFIG_BOOT_SIGNATURE_TYPE_NONE), so the image is produced *unsigned* (a
# hash TLV, no signature) via imgtool and is still bootable.
#
# The updater is a transient slot0 installer: you flash it to slot0 (serial /
# UF2 / debugger), it runs once to overwrite the bootloader partition, then you
# reflash your real app. It is therefore signed single-app/overwrite-style
# (CONFIG_MCUBOOT_BOOTLOADER_MODE_SINGLE_APP -> imgtool --overwrite-only, no
# swap trailer) regardless of whether the *target app* uses swap. RAM-load boards
# override this via conf/app-mode-ram_load.conf (passed by the Makefile). A
# second, swap-style slot1 variant with the pending trailer (imgtool --pad) is
# produced as a post-build step for boards whose layout has a slot1 (see the
# Makefile's `updater` target and tools/updater_sign.py) so the updater can be
# delivered as an OTA into the secondary slot too.

CONFIG_MAIN_STACK_SIZE=4096

# sys_reboot() after the update.
CONFIG_REBOOT=y

# We need flash (read/erase/write) and the flash map to address the boot
# partition by its DTS node label.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# External ``jedec,spi-nor`` (e.g. nrf54l15dk's mx25r64) must have its driver
# compiled or Zephyr's default flash map fails to link. No-op on boards without
# such a node (the symbol's ``depends on DT_HAS_JEDEC_SPI_NOR_ENABLED`` is
# unmet, so the assignment is dropped). Mirrors conf/adaboot.conf.
CONFIG_SPI_NOR=y

# This image is loaded and validated by mcuboot. It is a slot0 image linked
# against zephyr,code-partition (XIP), so force execute-in-place on; the N6
# board defconfig sets CONFIG_XIP=n (its FSBL apps run from RAM, which does not
# apply to this image). RAM-load boards override this back via
# conf/app-mode-ram_load.conf.
CONFIG_XIP=y

CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

# This image is loaded and validated by mcuboot.
CONFIG_BOOTLOADER_MCUBOOT=y

# The updater is a transient slot0 installer (see header comment): always sign
# it single-app/overwrite-style (no swap trailer). The slot1 swap-style variant
# is produced separately as a post-build step, not by changing this mode.
CONFIG_MCUBOOT_BOOTLOADER_MODE_SINGLE_APP=y

# Adaboot uses no signature (hash-only); produce an unsigned mcuboot image
# (no signing key required).
CONFIG_MCUBOOT_GENERATE_UNSIGNED_IMAGE=y

# Run-once: after overwriting the bootloader, request that the next boot stay
# in the bootloader's serial/UF2 recovery mode so the user can reflash their
# real application. Only effective on boards whose partition layout defines a
# zephyr,boot-mode retention area; silently dropped (and the matching code in
# src/main.c becomes a no-op via IS_ENABLED) on boards without one.
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y