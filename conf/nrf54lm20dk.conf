# Board-specific conf fragment for nrf54lm20dk.
#
# Applied by `make build BOARD=nrf54lm20dk` (and `make updater`)
# after conf/adaboot.conf via EXTRA_CONF_FILE, so the settings below layer on
# top of the signature defaults. nrf54lm20dk has a native USB device
# controller (zephyr_udc0 = &usbhs, already status="okay" in the board DTS) and
# boot-mode retention (gpregret1 -> zephyr,boot-mode in dts/nordic/nrf54lm20dk.dtsi),
# so it can run the Adaboot UF2 drag-and-drop update flow.
#
# With MCUBOOT_UF2_NO_APPLICATION=y the bootloader no longer panics when no
# bootable image is found -- it enters the bootloader update mode instead,
# presenting a USB mass storage drive so a .uf2 firmware file can be dragged
# onto it.

# Enable UF2 drag-and-drop firmware update (pulls in the USB device stack,
# USB MSC class and disk access). The USB device stack needs multithreading,
# which the bootloader otherwise disables on Nordic for code size, so turn
# it back on for this board.
CONFIG_MULTITHREADING=y
CONFIG_MCUBOOT_UF2=y

# Enable SMP serial recovery over the native USB CDC ACM port. Together
# with MCUBOOT_UF2 this gives a single bootloader update mode: the UF2
# mass storage drive *and* the mcumgr serial port are both active whenever
# the bootloader is entered (double-tap, boot-mode request, or no valid
# application). The CDC ACM port is added to zephyr_udc0 in this repo's
# dts/nordic/nrf54lm20dk.dtsi.
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_CDC_ACM=y

# Blink the status LED while the bootloader is in update mode: fast fade
# while waiting for firmware, very fast blink while flash is being written
# (the indicator behaviour of Adafruit_nRF52_Bootloader and tinyuf2). The
# board DTS maps the mcuboot-led0 alias to led0.
CONFIG_MCUBOOT_INDICATION_LED=y

# SMP client diagnostics while in update mode: the mcumgr/newtmgr OS-group
# "echo" command as a connectivity check (default off upstream), and the OS
# group "bootloader information" command (ID 8) which reports the bootloader
# name, its operating mode and the active slot, mirroring the command Zephyr's
# SMP server provides from the application side.
CONFIG_BOOT_MGMT_ECHO=y
CONFIG_BOOT_MGMT_BOOTLOADER_INFO=y

# Enter UF2 mode when no valid/bootable application image is found, rather than
# halting (FIH_PANIC). This is the Adaboot behavior: an empty slot0 still gets
# you a bootloader you can load firmware into.
CONFIG_MCUBOOT_UF2_NO_APPLICATION=y

# Enter UF2 mode on a double-tap of the reset button (uses the board's
# boot-mode retention). Covers the usual Adafruit "double-tap to enter the
# bootloader" UX while a valid app is present; the no-application fallback
# above handles the empty-flash case. The retention boot-mode subsystem is
# wired up in dts/nordic/nrf54lm20dk.dtsi (gpregret1 -> zephyr,boot-mode) but
# the retained-memory driver is not selected by default, so enable the chain
# here (RETAINED_MEM -> RETENTION -> RETENTION_BOOT_MODE).
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
CONFIG_MCUBOOT_UF2_ENTRANCE_DOUBLE_TAP=y

# Keep the main thread preemptible so the USB stack gets CPU time while the
# update mode polls for incoming UF2 blocks and services serial recovery.
CONFIG_MAIN_THREAD_PRIORITY=0
