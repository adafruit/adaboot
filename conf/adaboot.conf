#
# Universal Adaboot bootloader defaults, applied to every bootloader build.
#
# Adaboot is a UF2/serial-recovery bootloader, not a secure boot chain, so the
# bootloader image is built hash-only (no signature verification). Enable a
# signature type (and key) only if you want image verification.
#
# The upgrade mode (single_app vs swap-using-offset) is NOT set here: it is
# chosen by Kconfig from the layout (slot1 present -> swap, else single_app),
# see boot/zephyr/Kconfig BOOT_IMAGE_UPGRADE_MODE.

CONFIG_BOOT_SIGNATURE_TYPE_NONE=y

# Several boards this fork owns enable an external ``jedec,spi-nor`` chip in
# their partition layout (e.g. nrf54l15dk's mx25r64, which backs slot1 and the
# filesystem). Zephyr's default flash map emits an entry for every partition
# whose backing flash device is status="okay", and that entry references the
# device struct -- so the SPI NOR driver must be compiled or the link fails
# with an undefined ``__device_dts_ord_N``. ``CONFIG_SPI_NOR`` already
# defaults to y on boards with a ``jedec,spi-nor`` node and silently n
# elsewhere, so no assignment is needed here; the upstream board confs that
# used to disable it (nrf7002dk, nrf54l15dk) were updated for the same
# reason. (An unconditional ``CONFIG_SPI_NOR=y`` here cannot be used: on
# boards without the node the symbol ends up n, and kconfig turns the
# unmet-dependency assignment into a build-aborting warning.)

# Adaboot policy: the update interface follows the devicetree. Boards with a
# native USB device controller (zephyr_udc0) get the UF2 drive (Kconfig
# default in Kconfig.uf2); boards without one fall back to UART serial
# recovery (Kconfig default in Kconfig.serial_recovery). conf/<key>.conf can
# opt out either way -- e.g. to run the combined UF2 + serial update mode
# (typically with CONFIG_BOOT_SERIAL_CDC_ACM so both transports share the UF2
# USB device). Kconfig conf fragments cannot carry conditionals, so the
# decision lives in the defaults, not here.