#
# Application-side RAM-load override for the bootloader-updater build, applied
# only to boards whose tools/boards.toml mcuboot_mode is "ram_load". Tells the
# application's imgtool signing step (deps/zephyr/cmake/mcuboot.cmake) to produce
# a RAM-load image: the load address comes from the chosen zephyr,sram and the
# image is sized for slot0. USE_DT_CODE_PARTITION is *not* selected in this
# mode, so the app.overlay's zephyr,code-partition is ignored and the image
# links to RAM.
#
# Mirrors conf/mode-ram_load.conf (the bootloader side). SPI_NOR is in the
# updater's prj.conf (universal, no-op where there is no jedec,spi-nor node).

CONFIG_MCUBOOT_BOOTLOADER_MODE_RAM_LOAD=y