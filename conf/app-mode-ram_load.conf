#
# Application-side mode matching a bootloader built in ram_load mode
# (conf/mode-ram_load.conf, i.e. CONFIG_BOOT_RAM_LOAD). Tells the application's
# imgtool signing step (deps/zephyr/cmake/mcuboot.cmake) to produce a RAM-load
# image: the load address comes from the chosen zephyr,sram and the image is
# sized for slot0. USE_DT_CODE_PARTITION is *not* selected in this mode, so the
# app.overlay's zephyr,code-partition is ignored and the image links to RAM.
#
# Applied via -DEXTRA_CONF_FILE by the Makefile's `updater` target for boards
# whose tools/boards.toml mcuboot_mode is "ram_load" (e.g. nucleo_n657x0_q).

CONFIG_MCUBOOT_BOOTLOADER_MODE_RAM_LOAD=y

# External ``jedec,spi-nor`` (e.g. nucleo_n657x0_q's mx25um51245g) must have
# its driver compiled or Zephyr's default flash map fails to link. Mirrors
# conf/mode-ram_load.conf; a no-op on boards without such a node.
CONFIG_SPI_NOR=y