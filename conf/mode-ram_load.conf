#
# RAM-load bootloader override (applied only to boards whose
# tools/boards.toml mcuboot_mode is "ram_load", e.g. nucleo_n657x0_q, which
# executes from RAM rather than XIP).
#
# RAM-load is a CPU execution-model property, not a partition-layout property,
# so it cannot be derived from the devicetree the way single_app vs swap is. It
# overrides the layout-derived BOOT_IMAGE_UPGRADE_MODE default by selecting the
# BOOT_RAM_LOAD choice member. These boards define slot0_partition and
# slot1_partition in their layout overlay; the newer image is copied to RAM and
# executed from there.
#
# The signature-none / SPI_NOR defaults are in conf/adaboot.conf (universal).

CONFIG_BOOT_RAM_LOAD=y