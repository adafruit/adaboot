# Standalone Adaboot build config: RAM-load boards.
#
# Applied via -DEXTRA_CONF_FILE by `make build` for boards whose
# tools/boards.toml mcuboot_mode is "ram_load" (e.g. STM32N6, which executes
# from RAM rather than XIP). These boards define slot0_partition and
# slot1_partition in their layout overlay.
#
# Adaboot is a UF2 / serial-recovery bootloader, not a secure boot chain, so the
# bootloader image is built with no signature check (hash-only).

CONFIG_BOOT_SIGNATURE_TYPE_NONE=y
CONFIG_BOOT_RAM_LOAD=y

# External ``jedec,spi-nor`` (e.g. nucleo_n657x0_q's mx25um51245g) must have
# its driver compiled or Zephyr's default flash map fails to link. See
# conf/mode-single_app.conf for the rationale; this is a no-op on boards
# without such a node.
CONFIG_SPI_NOR=y