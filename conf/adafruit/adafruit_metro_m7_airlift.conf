#
# Board-specific conf fragment for adafruit_metro_m7_airlift.
#
# Applied by boot/zephyr/sysbuild/CMakeLists.txt after conf/adaboot.conf, so
# the settings below layer on top of the signature defaults.
#
# Blink the status LED while the bootloader is in update mode: fast fade
# while waiting for firmware, very fast blink while flash is being written
# (the indicator behaviour of Adafruit_nRF52_Bootloader and tinyuf2). The
# fork's dts/adafruit/adafruit_metro_m7_airlift.dtsi maps the mcuboot-led0 alias to the
# red D13 LED.
CONFIG_MCUBOOT_INDICATION_LED=y

# Honor the application's boot-mode request (reset_to_bootloader() /
# RunMode.UF2 in CircuitPython), through the OCRAM retention cell set up
# in dts/adafruit/adafruit_metro_m7_airlift.dtsi.
CONFIG_MCUBOOT_UF2_ENTRANCE_BOOT_MODE=y

# The board has no user button, so double-tapping reset is the manual way
# into the update mode, as with the TinyUF2 bootloader it replaces. It
# defaults on only for boards with an mcuboot-button0 alias.
CONFIG_MCUBOOT_UF2_ENTRANCE_DOUBLE_TAP=y

# No button: turn off the button entrance, which defaults on with GPIO.
CONFIG_MCUBOOT_UF2_ENTRANCE_GPIO=n
