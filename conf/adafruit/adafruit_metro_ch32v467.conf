#
# Board-specific conf fragment for adafruit_metro_ch32v467.
#
# Applied by boot/zephyr/sysbuild/CMakeLists.txt after conf/adaboot.conf, so
# the settings below layer on top of the signature defaults.
#
# Blink the status LED while the bootloader is in update mode. The fork's
# dts/adafruit/adafruit_metro_ch32v467.dtsi maps the mcuboot-led0 alias to the red D13 LED.
CONFIG_MCUBOOT_INDICATION_LED=y

# Honor the application's boot-mode request (reset_to_bootloader() /
# RunMode.UF2 in CircuitPython), through the SRAM retention cell set up in
# dts/adafruit/adafruit_metro_ch32v467.dtsi.
CONFIG_MCUBOOT_UF2_ENTRANCE_BOOT_MODE=y

# Double-tapping reset enters the update mode, as with the TinyUF2
# bootloader it replaces.
CONFIG_MCUBOOT_UF2_ENTRANCE_DOUBLE_TAP=y

# No mcuboot-button0 alias yet: turn off the button entrance.
CONFIG_MCUBOOT_UF2_ENTRANCE_GPIO=n

# The LED fade runs off a 1 ms k_timer; the WCH SysTick driver defaults
# to a 100 Hz tick.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
