#
# Application-side mode matching a bootloader built in single_app mode
# (conf/mode-single_app.conf, i.e. CONFIG_SINGLE_APPLICATION_SLOT). Tells the
# application's imgtool signing step (deps/zephyr/cmake/mcuboot.cmake) to size
# and align the image for the primary (slot0) slot -- the only slot the
# bootloader boots.
#
# Applied via -DEXTRA_CONF_FILE by the Makefile's `updater` target for boards
# whose tools/boards.toml mcuboot_mode is "single_app" (the default).

CONFIG_MCUBOOT_BOOTLOADER_MODE_SINGLE_APP=y

# External ``jedec,spi-nor`` (e.g. nrf54l15dk's mx25r64) must have its driver
# compiled or Zephyr's default flash map fails to link. Mirrors the same fix in
# conf/mode-single_app.conf; a no-op on boards without such a node.
CONFIG_SPI_NOR=y