#
# Board-specific conf fragment for frdm_mcxn947.
#
# Applied by boot/zephyr/sysbuild/CMakeLists.txt after conf/adaboot.conf, so
# the settings below layer on top of the signature defaults.
#
# Blink the status LED while the bootloader is in update mode: fast fade
# while waiting for firmware, very fast blink while flash is being written
# (the indicator behaviour of Adafruit_nRF52_Bootloader and tinyuf2). The
# fork's dts/nxp/frdm_mcxn947.dtsi maps the mcuboot-led0 alias to the red
# user LED (D34) and makes its node status="okay"; it ships disabled
# upstream.
CONFIG_MCUBOOT_INDICATION_LED=y

# Honor the application's boot-mode request (reset_to_bootloader() /
# RunMode.UF2 in CircuitPython): the fork's io_detect_boot_mode() reads the
# retention boot-mode flag (SRAM cell -> zephyr,boot-mode in
# dts/nxp/frdm_mcxn947.dtsi). The retained-memory chain
# (RETAINED_MEM -> RETENTION -> RETENTION_BOOT_MODE) is enabled in
# conf/adaboot.conf; this is the UF2 entrance that consumes the flag.
CONFIG_MCUBOOT_UF2_ENTRANCE_BOOT_MODE=y
