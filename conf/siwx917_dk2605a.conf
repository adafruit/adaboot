#
# Serial recovery drives the console UART (there is no zephyr,uart-mcumgr
# redirect on this board), and serial_adapter.c #errors while the UART
# console owns that port. The UART_CONSOLE default in
# Kconfig.serial_recovery can't win here because the board defconfig assigns
# UART_CONSOLE=y, so disable it explicitly.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# Honor the application's boot-mode request (reset_to_bootloader() /
# RunMode.UF2 in CircuitPython): the fork's io_detect_boot_mode() reads the
# retention boot-mode flag (NWP-reserved SRAM cell -> zephyr,boot-mode in
# dts/silabs/siwx917_dk2605a.dtsi). The retained-memory chain
# (RETAINED_MEM -> RETENTION -> RETENTION_BOOT_MODE) is enabled in
# conf/adaboot.conf. This board has no native USB device controller, so its
# update interface is UART serial recovery and the serial entrance consumes
# the flag (no zephyr,uart-mcumgr redirect on this board, so serial recovery
# drives the console UART that CONFIG_UART_CONSOLE=n frees above).
CONFIG_BOOT_SERIAL_BOOT_MODE=y
