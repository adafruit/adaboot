# Standalone Adaboot build config: single-slot boards (no OTA secondary slot).
#
# Applied via -DEXTRA_CONF_FILE by `make build` for boards whose
# tools/boards.toml mcuboot_mode is "single_app" (the default). These boards
# only define a slot0_partition in their layout overlay.
#
# Adaboot is a UF2 / serial-recovery bootloader, not a secure boot chain, so the
# bootloader image is built with no signature check (hash-only). Enable a
# signature type (and key) only if you want image verification.

CONFIG_BOOT_SIGNATURE_TYPE_NONE=y
CONFIG_SINGLE_APPLICATION_SLOT=y