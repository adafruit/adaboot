# Standalone Adaboot build config: single-slot boards (no OTA secondary slot).
#
# Applied via -DEXTRA_CONF_FILE by `make build` for boards whose
# tools/boards.toml mcuboot_mode is "single_app" (the default). These boards
# only define a slot0_partition in their layout overlay.
#
# Adaboot is a UF2 / serial-recovery bootloader, not a secure boot chain, so the
# bootloader image is built with no signature check (hash-only). Enable a
# signature type (and key) only if you want image verification.

CONFIG_BOOT_SIGNATURE_TYPE_NONE=y
CONFIG_SINGLE_APPLICATION_SLOT=y

# Several boards this fork owns enable an external ``jedec,spi-nor`` chip in
# their partition layout (e.g. nrf54l15dk's mx25r64, which backs slot1 and the
# filesystem). Zephyr's default flash map emits an entry for every partition
# whose backing flash device is status="okay", and that entry references the
# device struct -- so the SPI NOR driver must be compiled or the link fails
# with an undefined ``__device_dts_ord_N``. ``CONFIG_SPI_NOR`` defaults to y
# only in spirit; force it on here so the bootloader builds for those boards.
# On boards with no ``jedec,spi-nor`` node this assignment is dropped (the
# symbol's ``depends on DT_HAS_JEDEC_SPI_NOR_ENABLED`` is unmet), so it is a
# no-op there. ``SPI_NOR`` selects ``SPI`` and the JEDEC/SFDP helpers.
CONFIG_SPI_NOR=y