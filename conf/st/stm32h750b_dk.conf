#
# Board-specific conf fragment for stm32h750b_dk.
#
# Applied by boot/zephyr/sysbuild/CMakeLists.txt after conf/adaboot.conf, so
# the settings below layer on top of the signature defaults.
#
# Honor the application's boot-mode request (reset_to_bootloader() /
# RunMode.UF2 in CircuitPython): the fork's io_detect_boot_mode() reads the
# retention boot-mode flag (SRAM cell -> zephyr,boot-mode in
# dts/st/stm32h750b_dk.dtsi). The retained-memory chain
# (RETAINED_MEM -> RETENTION -> RETENTION_BOOT_MODE) is enabled in
# conf/adaboot.conf; this is the UF2 entrance that consumes the flag.
CONFIG_MCUBOOT_UF2_ENTRANCE_BOOT_MODE=y

# The USER button (mcuboot-button0 in the fork's dtsi) also enters UF2 mode:
# held at boot or pressed during the double-tap window. This needs the GPIO
# driver in the bootloader image; the board defconfig doesn't enable it (the
# app's board.conf never reaches the bootloader image), so without this the
# Kconfig default drops MCUBOOT_UF2_ENTRANCE_GPIO and the button is never
# read.
CONFIG_GPIO=y
CONFIG_MCUBOOT_UF2_ENTRANCE_GPIO=y
