# Auto-generated conf fragment for nrf54l15dk (slot layout).
# Generated by tools/partition_layout.py --fix; do not edit by hand --
# re-run `python3 tools/partition_layout.py --fix nrf54l15dk` after
# changing the layout. Hand-maintained board opt-ins (UF2, serial,
# retention, ...) belong in conf/<key>.conf, which is applied before
# this fragment so the computed sector geometry wins.
#
# BOOT_MAX_IMG_SECTORS sizes the swap-status trailer. AUTO can't derive
# it here: slot1 is on external SPI NOR whose jedec,spi-nor binding has
# no static erase-block-size (SFDP runtime discovery), so the build
# under-counts slot1's sectors. The planner knows the erase sizes, so it
# sets the max sector count directly: max(slot0, slot1).
#
# CONFIG_BOOT_MAX_IMG_SECTORS_AUTO is not set
CONFIG_BOOT_MAX_IMG_SECTORS=340
#
# This board's external NOR driver discovers its geometry at runtime
# (SFDP), and its page-layout Kconfig defaults to the 64K block
# erase -- which would enumerate slot1 as a handful of 64K pages
# instead of erase-size pages, making the slots' sector layouts
# incompatible. Pin it to the external flash's erase size.
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
