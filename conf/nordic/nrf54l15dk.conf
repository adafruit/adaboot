#
# Board-specific conf fragment for nrf54l15dk.
#
# Applied by boot/zephyr/sysbuild/CMakeLists.txt after conf/adaboot.conf, so
# the settings below layer on top of the signature defaults.
#
# nrf54l15dk has no native USB device controller, so its update mode is UART
# serial recovery (MCUBOOT_SERIAL, the Kconfig default for boards without
# zephyr_udc0). Honor the application's boot-mode request
# (reset_to_bootloader() / RunMode.UF2 in CircuitPython) by reading the
# retention boot-mode flag (gpregret1 -> zephyr,boot-mode in
# dts/nordic/nrf54l15dk.dtsi). The retained-memory chain
# (RETAINED_MEM -> RETENTION -> RETENTION_BOOT_MODE) is enabled in
# conf/adaboot.conf; this is the serial recovery entrance that consumes it.
CONFIG_BOOT_SERIAL_BOOT_MODE=y

# Blink the status LED while the bootloader is in update mode: fast fade
# while waiting for firmware, very fast blink while flash is being written
# (the indicator behaviour of Adafruit_nRF52_Bootloader and tinyuf2). The
# Zephyr board dtsi maps the mcuboot-led0 alias to led0.
CONFIG_MCUBOOT_INDICATION_LED=y
