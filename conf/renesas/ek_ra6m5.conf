#
# Board-specific conf fragment for ek_ra6m5.
#
# Applied by boot/zephyr/sysbuild/CMakeLists.txt after conf/adaboot.conf, so
# the settings below layer on top of the signature defaults.
#
# Honor the application's boot-mode request (reset_to_bootloader() /
# RunMode.UF2 in CircuitPython): the fork's io_detect_boot_mode() reads the
# retention boot-mode flag (SRAM cell -> zephyr,boot-mode in
# dts/renesas/ek_ra6m5.dtsi). The retained-memory chain
# (RETAINED_MEM -> RETENTION -> RETENTION_BOOT_MODE) is enabled in
# conf/adaboot.conf; this is the UF2 entrance that consumes the flag.
CONFIG_MCUBOOT_UF2_ENTRANCE_BOOT_MODE=y

# RA6 code flash has a 128-byte write block, which is larger than MCUboot's
# supported swap alignment. Preserve slot1 for Ethernet-delivered updates by
# copying it over slot0 without swap/rollback.
CONFIG_BOOT_UPGRADE_ONLY=y
